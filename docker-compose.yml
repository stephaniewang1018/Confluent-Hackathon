version: '3.8'

services:
  jobmanager:
    image: flink:1.16-scala_2.12
    container_name: flink_jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    volumes:
      - ./jars:/opt/flink/usrlib
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager

  taskmanager:
    image: flink:1.16-scala_2.12
    container_name: flink_taskmanager
    depends_on:
      - jobmanager
    command: taskmanager
    volumes:
      - ./jars:/opt/flink/usrlib

  sql-client:
    image: flink:1.16-scala_2.12
    container_name: flink_sql_client
    entrypoint: ["/bin/sh", "-c", "sleep infinity"]
    volumes:
      - ./sql:/sql
      - ./jars:/opt/flink/usrlib
    depends_on:
      - jobmanager

  mock-producer:
    image: python:3.10-slim
    container_name: mock_producer
    working_dir: /app
    volumes:
      - ./producer:/app
      - ./.env:/app/.env:ro
    env_file:
      - ./.env
    command: ["/bin/sh", "-c", "pip install -r requirements.txt && python producer.py"]

networks:
  default:
    name: confluent_hackathon_net
